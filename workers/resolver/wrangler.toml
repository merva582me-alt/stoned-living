name = "stoned-resolver"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Allow the worker to be queried from the Pages frontend and external scripts.
# In production, restrict origins via the CORS logic in src/index.ts.
# Routes are configured in the Cloudflare dashboard:
#   stoned.living/api/* → stoned-resolver

# Required Worker secret — run once per environment after deployment:
#   cd workers/resolver && wrangler secret put SPORTSRC_API_KEY
# For local dev, add to workers/resolver/.dev.vars:
#   SPORTSRC_API_KEY=<your_key>

[observability]
enabled = true
