<!DOCTYPE html>

    body { background: #0a0a0a; color: #fff; font-family: system-ui, sans-serif; padding: 20px; }
    h1 { font-size: 16px; color: #10b981; margin-bottom: 4px; }
    p  { font-size: 12px; color: #888; margin-bottom: 16px; }

    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    label { font-size: 12px; color: #aaa; }

    .status.err  { border-color: #7f1d1d; color: #f87171; background: #1a0000; }

    .player-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border: 2px solid #10b981; border-radius: 10px; overflow: hidden; box-shadow: 0 0 30px rgba(16,185,129,0.15); }
    .player-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    .log { margin-top: 14px; background: #111; border: 1px solid #222; border-radius: 8px; padding: 12px; }
    .log h2 { font-size: 11px; font-weight: 700; color: #10b981; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .05em; }
    .log-entry { font-size: 10px; font-family: monospace; padding: 2px 0; border-bottom: 1px solid #1a1a1a; color: #ccc; }
    .log-entry.event { color: #34d399; }
    .log-entry.warn  { color: #fbbf24; }
